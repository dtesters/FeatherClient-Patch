name: Update version index

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index from Dawn
        run: >
          python tools/build_index.py index
          "https://raw.githubusercontent.com/${{ github.repository }}/main/index"

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain index)" ]; then
            echo "Index unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index
          git commit -m "Update version index from Dawn"
          git push
